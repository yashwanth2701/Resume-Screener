spring.application.name=smart-resume-screener

# ---- MongoDB ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resume_screener}

# ---- File upload limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- LLM (Google Gemini) ----
# ---- LLM (Google Gemini) ----
llm.api.key=${GEMINI_API_KEY}
llm.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
llm.api.model=gemini-3.5-flash-lite
llm.api.max-tokens=1024

server.port=8080

logging.level.com.screener=INFO